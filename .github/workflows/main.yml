name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - dir: xodim-android
            artifact: Sartaroshxona-Xodim
          - dir: admin-android
            artifact: Sartaroshxona-Admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: ${{ matrix.app.dir }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p output
          cp "${{ matrix.app.dir }}/app/build/outputs/apk/debug/app-debug.apk" "output/${{ matrix.app.artifact }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.artifact }}
          path: output/${{ matrix.app.artifact }}.apk
          if-no-files-found: error
